<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Affiliate Link Maker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            background: #4653bb;
        }

        .result-box {
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .result-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .result-content {
            display: flex;
            gap: 8px;
        }

        .result-content input {
            font-size: 12px;
            font-family: 'Courier New', monospace;
            padding: 12px;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            flex: none;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
            padding: 0;
            background: white;
        }

        .icon-button:hover {
            transform: scale(1.05);
        }

        .icon-button::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            font-weight: normal;
        }

        .icon-button:hover::after {
            opacity: 1;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .icon-button::after {
                bottom: auto;
                top: -35px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">🛍️</div>
            <h1>Shopee Affiliate Link Maker</h1>
        </div>

        <form id="mainForm" onsubmit="createLink(event)">
            <div class="form-group">
                <label for="productUrl">Paste link sản phẩm Shopee:</label>
                <input type="url" id="productUrl" placeholder="https://shopee.vn/..." required>
            </div>

            <div class="button-group">
                <button type="submit">Tạo Link</button>
                <button type="reset">Xóa</button>
            </div>
        </form>

        <div id="message" class="message"></div>

        <div id="resultBox" class="result-box">
            <div class="result-content">
                <input type="text" id="resultLink" readonly>
                <button type="button" class="icon-button" onclick="copyLink()" data-tooltip="Copy" title="Copy link">
                    📋
                </button>
                <button type="button" class="icon-button" onclick="openLink()" data-tooltip="Mở" title="Mở link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="#667eea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="13 6 19 12 13 18" />
                        <line x1="3" y1="6" x2="3" y2="18" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ⭐ MÃ AFFILIATE CỦA BẠN
        const AFFILIATE_ID = "17396630390";

        function createLink(event) {
            event.preventDefault();

            const productUrl = document.getElementById('productUrl').value.trim();
            const messageDiv = document.getElementById('message');
            const resultBox = document.getElementById('resultBox');
            const resultLink = document.getElementById('resultLink');

            // Reset messages
            messageDiv.className = 'message';
            messageDiv.textContent = '';

            // Validate
            if (!productUrl) {
                showMessage('Vui lòng nhập link sản phẩm', 'error');
                return;
            }

            if (!productUrl.includes('shopee')) {
                showMessage('Link phải là từ Shopee.vn', 'error');
                return;
            }

            try {
                new URL(productUrl);
            } catch (e) {
                showMessage('Link không hợp lệ', 'error');
                return;
            }

            // Create affiliate link
            let affiliateLink = productUrl;
            const separator = affiliateLink.includes('?') ? '&' : '?';
            affiliateLink += separator + 'aff_code=' + AFFILIATE_ID;

            // Display result
            resultLink.value = affiliateLink;
            resultBox.classList.add('show');
            showMessage('✓ Link tạo thành công!', 'success');
        }

        function copyLink() {
            const resultLink = document.getElementById('resultLink');
            resultLink.select();

            try {
                document.execCommand('copy');
                showMessage('✓ Đã copy link!', 'success');
            } catch (err) {
                navigator.clipboard.writeText(resultLink.value).then(() => {
                    showMessage('✓ Đã copy link!', 'success');
                });
            }
        }

        function openLink() {
            const resultLink = document.getElementById('resultLink').value;
            if (resultLink) {
                window.open(resultLink, '_blank');
                showMessage('✓ Đang mở...', 'success');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }
    </script>
</body>

</html>
